# BuildOS Prometheus recording + alerting rules (Phase 4b-i + 4b-ii).
#
# Load into Prometheus via `rule_files:` (and route the alerts through
# Alertmanager). Validate before deploying:
#
#     promtool check rules deploy/prometheus/buildos.rules.yml
#
# Every expression references ONLY the five metrics BuildOS actually emits from
# internal/obs/metrics.go (custom registry — there are NO go_*/process_* or
# db-pool metrics; see deploy/prometheus/README.md and the observability
# runbook for the surface + known instrumentation gaps):
#
#   buildos_http_requests_total{route,method,status}     status ∈ 2xx/3xx/4xx/5xx/1xx/0xx   (server)
#   buildos_http_request_duration_seconds{route,method}  (histogram → _bucket/_sum/_count)  (server)
#   buildos_ai_requests_total{kind,model,outcome}        outcome ∈ success/error            (server + worker)
#   buildos_ai_request_duration_seconds{kind,model}      (histogram)                        (server + worker)
#   buildos_river_job_runs_total{kind,outcome}           outcome ∈ success/error/discarded  (worker)
#
# Scrape surface: BOTH processes expose /metrics — the SERVER (cmd/server: HTTP
# middleware + the AI client) and, since 4b-ii, the WORKER (cmd/worker: a
# /metrics listener + River job-outcome subscription wiring ObserveJob, plus the
# AI client for worker-side delay_cascade/foresight). `outcome="error"` on River
# is ATTEMPT-level (River retries up to its policy; each failed attempt is an
# event; a terminal give-up is `discarded`). `up` is synthesized by Prometheus
# per scrape target (jobs `buildos-server` + `buildos-worker`; see the README).
#
# Thresholds are conservative defaults TUNED FOR A LOW-TRAFFIC, SINGLE-TENANT
# FORK (one builder's deployment): ratio alerts carry a minimum-traffic floor so
# "1 error out of 2 requests" can't page anyone, and there is deliberately NO
# "no traffic" alert (a small fork is legitimately idle overnight). Tune per
# deployment; every threshold is called out in the observability runbook.

groups:
  # ---------------------------------------------------------------------------
  # Recording rules — pre-computed ratios/quantiles for dashboards + to keep the
  # alert expressions below readable. Evaluated first (separate group).
  # ---------------------------------------------------------------------------
  - name: buildos-recording
    interval: 30s
    rules:
      - record: buildos:http_requests:rate5m
        expr: sum(rate(buildos_http_requests_total[5m]))
      - record: buildos:http_5xx_ratio:rate5m
        expr: |
          sum(rate(buildos_http_requests_total{status="5xx"}[5m]))
            / clamp_min(sum(rate(buildos_http_requests_total[5m])), 1e-9)
      - record: buildos:http_4xx_ratio:rate5m
        expr: |
          sum(rate(buildos_http_requests_total{status="4xx"}[5m]))
            / clamp_min(sum(rate(buildos_http_requests_total[5m])), 1e-9)
      # p95 EXCLUDES the synchronous AI routes (daily-briefing / chat /
      # recommend-adjustments / invoices-ingest): they take 5-60s by design and
      # share the global HTTP histogram (DefBuckets, max finite 10s → +Inf), so
      # one AI call on a low-traffic fork would otherwise dominate p95 and page.
      - record: buildos:http_request_duration_seconds:p95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(
            buildos_http_request_duration_seconds_bucket{route!~"/api/v1/.*(daily-briefing|chat|recommend-adjustments|ingest).*"}[5m]
          )))
      - record: buildos:ai_requests:rate10m
        expr: sum(rate(buildos_ai_requests_total[10m]))
      - record: buildos:ai_error_ratio:rate10m
        expr: |
          sum(rate(buildos_ai_requests_total{outcome="error"}[10m]))
            / clamp_min(sum(rate(buildos_ai_requests_total[10m])), 1e-9)
      - record: buildos:ai_request_duration_seconds:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(buildos_ai_request_duration_seconds_bucket[10m])))
      - record: buildos:river_jobs:rate10m
        expr: sum(rate(buildos_river_job_runs_total[10m]))
      - record: buildos:river_error_ratio:rate10m
        expr: |
          sum(rate(buildos_river_job_runs_total{outcome="error"}[10m]))
            / clamp_min(sum(rate(buildos_river_job_runs_total[10m])), 1e-9)

  # ---------------------------------------------------------------------------
  # Availability — both scrape targets (server + worker) are up and serving.
  # ---------------------------------------------------------------------------
  - name: buildos-availability
    rules:
      - alert: BuildOSServerDown
        # `up` is 0 when Prometheus cannot scrape the server (process down,
        # /metrics unreachable, or the network policy is blocking the scraper).
        expr: up{job="buildos-server"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BuildOS server ({{ $labels.instance }}) is down"
          description: >
            Prometheus has failed to scrape the buildos-server target
            {{ $labels.instance }} for >2m. The process may have crashed,
            /metrics may be unreachable, or the scrape network policy may be
            misconfigured. Check the orchestrator (pod restarts / OOMKilled),
            then /health (liveness) and /ready (DB).
          runbook_url: "https://github.com/futurebuildai/buildos/blob/main/docs/observability-runbook.md#buildosserverdown"

      - alert: BuildOSWorkerDown
        # The worker runs ALL background jobs (briefings, notifications,
        # cascades, rollups, foresight). If it's down, the API still serves but
        # nothing scheduled happens — a silent functional outage.
        expr: up{job="buildos-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BuildOS worker ({{ $labels.instance }}) is down"
          description: >
            Prometheus has failed to scrape the buildos-worker target
            {{ $labels.instance }} for >2m. Background jobs (daily briefings,
            field notifications, delay cascades, corporate rollups, foresight
            sweeps) are NOT running — the API still serves but scheduled work has
            stopped. Check the orchestrator, then the worker's /health + /ready.
          runbook_url: "https://github.com/futurebuildai/buildos/blob/main/docs/observability-runbook.md#buildosworkerdown"

  # ---------------------------------------------------------------------------
  # HTTP API — 5xx rate + latency. (4xx is client-driven; see the warning rule.)
  # ---------------------------------------------------------------------------
  - name: buildos-http
    rules:
      - alert: BuildOSHTTP5xxRateHigh
        # >5% of requests are 5xx over 5m, with a floor of ~0.05 req/s (~3/min)
        # so a single error during near-zero traffic can't page.
        expr: |
          buildos:http_5xx_ratio:rate5m > 0.05
            and buildos:http_requests:rate5m > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "BuildOS HTTP 5xx rate high ({{ $value | humanizePercentage }})"
          description: >
            More than 5% of HTTP responses are 5xx over the last 5m. Likely a DB
            outage (check /ready), an unhandled panic (check Sentry + logs for
            the request_id/trace_id trio), or a dependency failure. Correlate by
            route via buildos_http_requests_total{status="5xx"}.
          runbook_url: "https://github.com/futurebuildai/buildos/blob/main/docs/observability-runbook.md#buildoshttp5xxratehigh"

      - alert: BuildOSHTTP5xxRateElevated
        expr: |
          buildos:http_5xx_ratio:rate5m > 0.01
            and buildos:http_requests:rate5m > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "BuildOS HTTP 5xx rate elevated ({{ $value | humanizePercentage }})"
          description: >
            >1% of responses are 5xx, sustained 15m. Below the paging threshold
            but worth investigating before it escalates.
          runbook_url: "https://github.com/futurebuildai/buildos/blob/main/docs/observability-runbook.md#buildoshttp5xxratehigh"

      - alert: BuildOSHTTPLatencyP95High
        expr: buildos:http_request_duration_seconds:p95 > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "BuildOS HTTP p95 latency high ({{ $value | humanizeDuration }})"
          description: >
            HTTP p95 latency >1s for 10m. The deterministic core (CPM physics) is
            sub-millisecond, so a slow p95 usually means DB contention/pool
            saturation or a slow dependency. Note: AI endpoints are intentionally
            slow — exclude them in a per-route breakdown if they dominate.
          runbook_url: "https://github.com/futurebuildai/buildos/blob/main/docs/observability-runbook.md#buildoshttplatencyp95high"

      - alert: BuildOSHTTP4xxRateElevated
        # 4xx is mostly client error, but a sustained spike can indicate a
        # broken client deploy OR a SetupGate misconfiguration 403-walling
        # operational traffic (SETUP_INCOMPLETE) — note: status is class-only,
        # so this CANNOT isolate the setup gate; see the runbook + the
        # instrumentation follow-up.
        expr: |
          buildos:http_4xx_ratio:rate5m > 0.40
            and buildos:http_requests:rate5m > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "BuildOS HTTP 4xx rate elevated ({{ $value | humanizePercentage }})"
          description: >
            >40% of responses are 4xx, sustained 15m. Check for a broken client
            build, an expired-credential storm (401), or — if the org never
            completed onboarding — SetupGate returning 403 SETUP_INCOMPLETE on
            operational routes.
          runbook_url: "https://github.com/futurebuildai/buildos/blob/main/docs/observability-runbook.md#buildoshttp4xxrateelevated"

      - alert: BuildOSAuthRoute5xx
        # The auth/onboarding routes (login, first-owner claim, refresh, password
        # reset) are LOW-VOLUME but critical — a 100%-broken login would be
        # diluted below the global 5xx ratio by healthy traffic elsewhere. Page
        # on ANY sustained 5xx on /api/v1/auth/*, independent of overall mix.
        expr: sum(rate(buildos_http_requests_total{route=~"/api/v1/auth/.*",status="5xx"}[5m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "BuildOS auth/onboarding routes returning 5xx"
          description: >
            One or more /api/v1/auth/* routes have returned 5xx sustained for 10m
            — sign-in or first-owner claim may be broken (users locked out),
            independent of overall traffic. Check /ready (DB), Sentry, and
            buildos_http_requests_total{route=~"/api/v1/auth/.*",status="5xx"}.
          runbook_url: "https://github.com/futurebuildai/buildos/blob/main/docs/observability-runbook.md#buildosauthroute5xx"

  # ---------------------------------------------------------------------------
  # AI — the harness soft-fails by design (503 when no key / upstream down), so
  # these are WARNINGS, not pages. They catch a misconfigured/rejected key or a
  # sustained Anthropic outage degrading the agentic surface.
  # ---------------------------------------------------------------------------
  - name: buildos-ai
    rules:
      - alert: BuildOSAIErrorRateHigh
        # NOTE: buildos_ai_requests_total counts ATTEMPTS, not logical calls —
        # ObserveAICall fires on every retry-loop branch (MaxAttempts 3), so a
        # retried-then-successful call still emits error attempts. Threshold set
        # at 40% (not 25%) to absorb ~1 retry per success; the floor (>0.0017 ≈
        # needs >=2 attempts in the 10m window) stops a single isolated attempt
        # from warning.
        expr: |
          buildos:ai_error_ratio:rate10m > 0.40
            and buildos:ai_requests:rate10m > 0.0017
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "BuildOS AI error-attempt rate high ({{ $value | humanizePercentage }})"
          description: >
            >40% of native Anthropic call ATTEMPTS errored over 10m (the client
            retries up to 3×, so transient blips inflate this — a retried-then-
            successful call still emits error attempts). AI degrades gracefully
            (503/soft-fail), so this won't break the deterministic core — but the
            agentic surface (chat/briefing/foresight/ingestion) is degraded.
            Check the stored Anthropic key (rejected/rotated?), the provider
            status, and buildos_ai_requests_total{outcome="error"} by kind+model.
          runbook_url: "https://github.com/futurebuildai/buildos/blob/main/docs/observability-runbook.md#buildosaierrorratehigh"

      - alert: BuildOSAILatencyP95High
        expr: buildos:ai_request_duration_seconds:p95 > 45
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "BuildOS AI p95 latency high ({{ $value | humanizeDuration }})"
          description: >
            Native Anthropic p95 latency >45s for 10m (the AI client caps at
            ~60s). Sustained slowness risks request timeouts on the synchronous
            AI endpoints. Usually upstream; check the provider status page.
          runbook_url: "https://github.com/futurebuildai/buildos/blob/main/docs/observability-runbook.md#buildosailatencyp95high"

  # ---------------------------------------------------------------------------
  # River background jobs (worker; wired in 4b-ii). Failures and — worse —
  # discards (retries exhausted → the work silently did not happen: a missed
  # briefing, an unsent notification, a dropped delay-cascade).
  # ---------------------------------------------------------------------------
  - name: buildos-jobs
    rules:
      - alert: BuildOSRiverJobErrorRateHigh
        # outcome="error" is ATTEMPT-level (River retries), so transient blips
        # self-heal; a sustained ratio means a systemic failure. Floor ~1 run/10m.
        expr: |
          buildos:river_error_ratio:rate10m > 0.20
            and buildos:river_jobs:rate10m > 0.0017
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "BuildOS River job error-attempt rate high ({{ $value | humanizePercentage }})"
          description: >
            >20% of River job-run ATTEMPTS errored over 10m (River retries, so a
            retried-then-successful job still emits error attempts). A sustained
            rate is systemic — DB, a downstream API, or a bug. Break down by kind:
            sum by (kind) (rate(buildos_river_job_runs_total{outcome="error"}[10m]))
            and inspect the River job tables for the args + last error.
          runbook_url: "https://github.com/futurebuildai/buildos/blob/main/docs/observability-runbook.md#buildosriverjoberrorratehigh"

      - alert: BuildOSRiverJobsDiscarded
        # A discard = River gave up after exhausting retries. The job's effect
        # never happened and won't retry. Fires on any discard in the last 15m.
        # CAVEAT: buildos_river_job_runs_total is fed by River's subscription
        # channel, which is buffered + NON-BLOCKING — under burst an event can
        # drop, so this absolute (>0) signal is BEST-EFFORT and may UNDERCOUNT.
        # The River job tables (state='discarded') are the source of truth;
        # reconcile against them periodically (esp. after a worker restart/burst).
        expr: increase(buildos_river_job_runs_total{outcome="discarded"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "BuildOS River discarded a job (retries exhausted): {{ $labels.kind }}"
          description: >
            A {{ $labels.kind }} job was DISCARDED — its effect (briefing,
            notification, cascade, rollup, etc.) did not happen and won't retry.
            Inspect the River job table for the failure, fix the root cause, and
            re-enqueue if the work still matters.
          runbook_url: "https://github.com/futurebuildai/buildos/blob/main/docs/observability-runbook.md#buildosriverjobsdiscarded"
