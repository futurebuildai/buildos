# CI for BuildOS — every PR + every push to main runs through this.
#
# Composition:
#   1. lint-migrations    — Composite Currency + paired up/down +
#                           destructive opt-in + CONCURRENTLY index
#                           (blocks any unsafe migration at PR time)
#   2. lint-go            — gofmt, go vet, govulncheck
#                           (vulnerability scan is CI-blocking, not
#                            advisory — per ADR-002 enterprise posture)
#   3. test               — unit suite, both default and -tags=prod
#   4. test-integration   — Testcontainers-backed Postgres tests
#   5. bench-physics      — CPM benchmark gates (80-task ≤200ms,
#                            200-task ≤500ms; CI hard-fail on regression)
#   6. web / mobile       — frontend lint/typecheck/test/build (backend-free)
#   7. e2e                — live cmd/server (native auth) + Postgres service,
#                            driving the first-run → wizard → portfolio web
#                            journey AND the CPM recalc → cascade journey
#                            (--seed-schedule) via scripts/e2e-backend.sh
#   8. e2e-mobile         — same live server (--seed-field) driving the Flutter
#                            offline-outbox lane: claim → queue → reconnect →
#                            drain → server-side idempotency replay (409)
#   9. docker-build       — confirms the production image still builds;
#                            uploads SBOM + image-as-artifact (signing
#                            happens in release.yml on tagged builds)
#
# Shared concurrency cancels in-flight runs on a new push, so a
# rapid-fire push doesn't leave stale CI burning runners.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  lint-migrations:
    name: Migration linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/lint-migrations.sh
      - name: Run lint regression suite
        run: bash scripts/lint-migrations.test.sh

  lint-go:
    name: Go vet + govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        # gofmt -l prints any unformatted files. CI-fails if any output.
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt issues:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go vet (prod build tag)
        # The prod-tagged file set differs (auth_dev.go vs auth_prod.go).
        # Vet must clean both modes or a release build can fail at the
        # worst possible time.
        run: go vet -tags=prod ./...
      - name: govulncheck (CI-blocking, both build modes)
        # Run twice: default tags cover dev-mode code (the auth_dev.go
        # bypass path, integration test deps); prod tags cover what
        # actually ships. A vuln in either is a CI fail — we ship one
        # or the other in any given environment.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -tags='integration' ./...
          govulncheck -tags='prod' ./...

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make test
      - run: make test-prod

  test-integration:
    name: Integration tests (Testcontainers + Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run integration tests
        # Testcontainers boots a fresh Postgres per test; CI runner
        # already has Docker available.
        run: make test-integration

  bench-physics:
    name: Physics benchmarks (hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make bench-physics

  web:
    name: Web console (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (clean, lockfile-pinned)
        run: npm ci
      - name: Lint (eslint + composite-currency rule + prettier)
        run: npm run lint
      - name: Typecheck (tsc --noEmit, strict)
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E + axe a11y (Playwright)
        run: npm run test:e2e

  mobile:
    name: Field app (format + analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch packages
        run: flutter pub get
      - name: Format check (dart format)
        # --set-exit-if-changed CI-fails if anything isn't canonically
        # formatted, mirroring the Go gofmt gate above.
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze (flutter analyze)
        run: flutter analyze
      - name: Unit + widget tests
        # Includes the offline-outbox drain matrix (success / 409-already-
        # accepted / 4xx-park / 5xx-backoff / offline) against an in-memory
        # Drift DB — no live backend needed.
        run: flutter test

  e2e:
    name: E2E (live backend ← native auth → web journeys)
    runs-on: ubuntu-latest
    # Boots a REAL cmd/server (native auth, vault on) against a migrated+seeded
    # Postgres via scripts/e2e-backend.sh, then drives the first-run claim →
    # 6-step wizard → complete → portfolio journey through the Vite-proxied web
    # client. This is the only lane that exercises the native auth/claim/wizard
    # path end to end — the unit/e2e lanes above run backend-free.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fb_user
          POSTGRES_PASSWORD: fb_pass
          POSTGRES_DB: futurebuild_os
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fb_user -d futurebuild_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Point the harness + Makefile migrate at the service container. The port
      # mapping (5433:5432) matches the harness's local-dev default DSN, so no
      # other override is needed.
      DATABASE_URL: postgres://fb_user:fb_pass@localhost:5433/futurebuild_os?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install psql client (harness uses it to seed + wait on Postgres)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install web deps (clean, lockfile-pinned)
        run: npm ci
        working-directory: web
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Live journey (harness boots server; Playwright drives the web client)
        # The harness does NOT pass --db-up (Postgres is a service container);
        # it migrates, seeds fork-zero, boots cmd/server, exports the E2E_*
        # contract, then runs the live Playwright config (which itself starts
        # the Vite dev server that proxies /api → :8080).
        #
        # --seed-schedule plants a project + linear FS task chain (onboarding
        # stays incomplete, so the wizard still runs in the onboarding spec).
        # That feeds the recalc-cascade spec, which logs in as the owner the
        # onboarding journey creates and runs the CPM recalc end to end.
        run: bash scripts/e2e-backend.sh --seed-schedule -- npm --prefix web run test:e2e:live

  e2e-mobile:
    name: E2E (live backend ← native auth → field offline outbox)
    runs-on: ubuntu-latest
    # Boots the same REAL cmd/server (native auth, vault on) as the `e2e` job,
    # but with --seed-field: an onboarding-COMPLETE org plus a project + task to
    # report progress against. The Flutter live test then exercises the only
    # mobile lane that hits the real claim → /field/progress → /field/sync
    # contract: queue offline, reconnect, drain, and replay the same
    # idempotency_key to assert the server's 409 dedup the outbox relies on.
    # The backend-free `mobile` job above can't catch wire-shape or
    # idempotency drift; this lane can.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fb_user
          POSTGRES_PASSWORD: fb_pass
          POSTGRES_DB: futurebuild_os
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U fb_user -d futurebuild_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fb_user:fb_pass@localhost:5433/futurebuild_os?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install psql client (harness uses it to seed + wait on Postgres)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Fetch Flutter packages
        run: flutter pub get
        working-directory: mobile
      - name: Live field outbox journey (harness boots server; Flutter drives it)
        # No --db-up (Postgres is a service container). --seed-field marks the
        # org onboarding-complete and seeds the project + task, exporting the
        # E2E_* contract the test reads. The test self-skips when that env is
        # absent, so this is the only place it actually runs.
        run: bash scripts/e2e-backend.sh --seed-field -- bash -c 'cd mobile && flutter --no-version-check test test/live/sync_live_test.dart'

  docker-build:
    name: Production image build
    runs-on: ubuntu-latest
    needs: [lint-migrations, lint-go, test, bench-physics]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute build metadata
        id: meta
        run: |
          {
            echo "version=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA::8}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - name: Build (multi-arch, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # CI confirms the image builds for both arches and is loadable
          # for the smoke test below. Push happens in release.yml on
          # tag events, where signing keys are provisioned.
          load: false
          tags: buildos:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
      - name: Build (host arch, load for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: buildos:ci-smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
      - name: Smoke-run image (verify entrypoint resolves)
        run: |
          # Exit 64 is what the entrypoint returns for an unknown role —
          # confirms the binary is loadable, the role-dispatch logic
          # runs, and a deliberately-bad role is rejected with the
          # documented exit code. The point isn't to start the real
          # server (no DB available); it's to prove the image isn't
          # broken at the layer below the application.
          set +e
          docker run --rm -e BUILDOS_ROLE=invalid buildos:ci-smoke
          rc=$?
          if [ "$rc" -ne 64 ]; then
            echo "::error::expected exit 64 from invalid role; got $rc"
            exit 1
          fi
          echo "smoke ok: entrypoint rejects unknown role with documented rc=64"
      - name: Trivy vulnerability scan (CI-blocking on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: buildos:ci-smoke
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          vuln-type: os,library
