# SHBC × BuildOS demo — nginx config
# Variables expanded by nginx:alpine's /docker-entrypoint.d/20-envsubst-on-templates.sh.
# $PORT is supplied by Railway (or defaults to 8080 from the Dockerfile ENV).

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML — never cache, so demo updates land on the next page load.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # JSON (mock data) — short cache; the demo's "today" math will look
    # stale if data is cached aggressively.
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=60" always;
    }

    # Static assets — moderate cache. We don't fingerprint yet; if/when
    # we add a build pipeline this can become "immutable".
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Hash-based SPA routing handles itself client-side; no fallback rule
    # needed, but a 404 → index.html catch keeps direct deep links viable
    # if the demo ever switches to history-mode routing.
    error_page 404 /index.html;

    # Security headers (light — this is a public marketing demo).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip for text-y content.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
      text/plain
      text/css
      application/javascript
      application/json
      image/svg+xml;
}
