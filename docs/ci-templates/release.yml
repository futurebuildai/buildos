# Release pipeline — fires on tag push (v*.*.*).
#
# Outputs:
#   1. Multi-arch container image (linux/amd64 + linux/arm64) pushed to
#      GHCR (ghcr.io/futurebuildai/buildos:<tag>).
#   2. cosign-signed image attestation (keyless, OIDC-bound to the
#      GitHub Actions identity). Customer forks verifying signatures
#      use `cosign verify --certificate-identity-regexp ...` to confirm
#      the image was built by this repo's release pipeline, not an
#      arbitrary attacker.
#   3. SBOM (CycloneDX format) generated by syft, attached to the image
#      via cosign attest. Procurement teams reading SBOMs see the full
#      Go-module dependency tree.
#   4. GitHub Release with auto-generated changelog from git log.
#
# Why keyless cosign vs. our own signing key:
#   - Avoids the "where do we store the cosign private key" problem.
#   - Each fork operator can independently verify "this image was
#     built by the canonical buildos repo on this commit" via OIDC.
#   - Custom signing keys can land later if a customer requires
#     air-gapped verification; not all do.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write     # GitHub Release create
  packages: write     # GHCR push
  id-token: write     # cosign keyless OIDC token

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build, sign, and publish container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog generation

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # On tag push: tag the image with the version (v1.2.3),
          # major.minor (1.2), and "latest" if it's not a pre-release.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute build metadata
        id: build_meta
        run: |
          {
            echo "version=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA::8}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build_meta.outputs.version }}
            COMMIT=${{ steps.build_meta.outputs.commit }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
          # Cache build layers in GHCR for fast incremental rebuilds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Sign image (keyless, OIDC-bound)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # Sign every tag the metadata-action produced. The digest is
          # what we actually sign; tag-to-digest resolution is via the
          # registry. Using the digest from the build action is more
          # reliable than re-resolving by tag (avoids race conditions
          # if a parallel push moves the tag).
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Generate SBOM
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            -o cyclonedx-json=sbom.cyclonedx.json
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            -o spdx-json=sbom.spdx.json

      - name: Attach SBOM to image (cosign attest)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Generate release notes
        id: notes
        run: |
          # Pull the previous tag for a clean since-last-release range.
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -n "$prev" ]; then
            range="${prev}..${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
          fi
          {
            echo "notes<<EOF"
            git log --pretty=format:"- %s (%h)" "$range"
            echo
            echo
            echo "Built from commit \`${GITHUB_SHA}\`"
            echo "Image: \`${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            sbom.cyclonedx.json
            sbom.spdx.json
          generate_release_notes: false  # we generated our own above
