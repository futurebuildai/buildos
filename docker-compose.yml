services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fb_user
      POSTGRES_PASSWORD: fb_pass
      POSTGRES_DB: futurebuild_os
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fb_user -d futurebuild_os"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
